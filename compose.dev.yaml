# Use with: docker compose -f compose.yaml -f compose.dev.yaml up --build -d
services:
  dashboard:
    volumes:
      - ./src:/app/src:ro
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://dashboard:8000
      DOCKER_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      dashboard:
        condition: service_healthy

volumes:
  frontend_node_modules:
